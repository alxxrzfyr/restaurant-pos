# --- Database ---
db.file=restaurant-pos.db
db.pool.maxSize=4
db.pool.minIdle=1
db.pool.connectionTimeoutMs=10000
db.busyTimeoutMs=30000

# --- Security ---
security.login.maxFailedAttempts=5
security.login.lockoutWindowMinutes=15
security.login.lockoutDurationMinutes=15

# --- Application ---
app.name=Restaurant POS
app.version=1.0.0
app.timezone=Asia/Manila
